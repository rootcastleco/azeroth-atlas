<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NPC Database — Azeroth Atlas</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Roboto+Condensed:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#15120e;color:#dfd3bd;font:15px 'Roboto Condensed',sans-serif}header{background:#0c0b09;border-bottom:3px ridge #776244;padding:20px 5%;display:flex;justify-content:space-between}.logo,h1,h2{font-family:Cinzel;color:#e4c987}.logo{font-size:20px;font-weight:700}main{max-width:1300px;margin:36px auto;padding:0 20px}a{color:#dcc18b}button,input{font:inherit}.btn{background:linear-gradient(#5e482a,#352717);border:2px ridge #927a53;color:#f1d6a0;padding:9px 14px;cursor:pointer}.nav{display:flex;gap:12px;margin:20px 0}.panel{border:3px ridge #776244;background:#171511;box-shadow:0 5px 20px #0008}.toolbar{padding:15px;background:#292217}.toolbar input{background:#0e0d0b;color:#eee;border:1px solid #79664a;padding:12px;width:min(650px,90%)}.status{padding:13px 16px;color:#c7b598}.grid{display:grid;grid-template-columns:1fr 370px;min-height:450px}.rows{border-right:1px solid #655338}.row{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid #30281e;color:#e6cb8f;padding:12px 16px;cursor:pointer}.row:hover{background:#3b2c1a}.row span{display:block;color:#9b8d76;margin-top:4px}.detail{padding:20px;background:#1e1912}.tooltip{border:2px solid #8f7959;background:#080910;padding:18px;line-height:1.6;overflow-wrap:anywhere}.ids{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.ids a,.ids span{background:#292117;border:1px solid #564733;padding:5px 8px}.pager{display:flex;gap:15px;align-items:center;padding:15px;border-top:1px solid #53442d}.note,footer{color:#ab9a7e;line-height:1.6;font-size:13px}footer{margin-top:25px}button:disabled{opacity:.4}@media(max-width:750px){.grid{grid-template-columns:1fr}.rows{border-right:0}.detail{border-top:1px solid #655338}.nav{flex-wrap:wrap}}@media(max-width:750px){html,body{overflow-x:hidden}main{padding:0 12px;margin:22px auto}.toolbar input{box-sizing:border-box;width:100%;font-size:16px}.detail{display:none;position:fixed;z-index:20;bottom:0;left:0;right:0;max-height:80dvh;overflow:auto;border:3px ridge #8b714a;border-radius:12px 12px 0 0;box-shadow:0 0 0 100vmax #000b}.detail.mobile-open{display:block}.close-mobile{display:block!important;float:right;font-size:24px;background:none;border:0;color:#ead5a6}.ids{gap:5px}}.close-mobile{display:none}</style></head><body><header><div class="logo">AZEROTH ATLAS</div><button class="btn" id="lang">EN</button></header><main><h1 id="title">NPC Veritabanı</h1><p id="intro">Retail NPC adları, NPC ID ve model ID grupları.</p><nav class="nav"><a class="btn" href="index.html">ITEMS</a><span class="btn">NPC</span></nav><p class="note" id="note" hidden></p><div class="panel"><div class="toolbar"><input id="search" placeholder="NPC adı, NPC ID veya model ID ara..." aria-label="Ara"></div><div class="status" id="status" role="status">Veriler yükleniyor...</div><div class="grid"><div><div id="rows" class="rows"></div><div class="pager"><button id="prev" class="btn">‹</button><span id="page"></span><button id="next" class="btn">›</button></div></div><aside class="detail" id="detail">Bir NPC seç.</aside></div></div><footer hidden><span id="footer"></span><span id="foot2"></span></footer></main><script>
let lang=localStorage.getItem('atlas-lang')||'tr',items=[],found=[],page=1,selected=null;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function text(tr,en){return lang==='tr'?tr:en}function render(){let n=Math.max(1,Math.ceil(found.length/40));page=Math.max(1,Math.min(page,n));$('page').textContent=`${page} / ${n}`;$('prev').disabled=page===1;$('next').disabled=page===n;$('status').textContent=found.length.toLocaleString(lang==='tr'?'tr-TR':'en-US')+text(' isim grubu',' name groups');$('rows').innerHTML=found.slice((page-1)*40,page*40).map((x,i)=>`<button class="row" data-i="${(page-1)*40+i}">${esc(x.name)}<span>${x.npcs.length} NPC ID · ${x.displays.length} Display ID</span></button>`).join('')||`<p class="status">${text('Sonuç bulunamadı.','No results found.')}</p>`}function filter(){let q=$('search').value.toLowerCase().trim();found=items.filter(x=>!q||x.index.includes(q));page=1;render()}function show(x){selected=x;$('detail').innerHTML=`<button class="close-mobile" aria-label="Kapat" onclick="document.getElementById('detail').classList.remove('mobile-open')">×</button><h2>${esc(x.name)}</h2><div class="tooltip"><b>NPC ID</b><div class="ids">${x.npcs.map(id=>`<span>${id}</span>`).join('')||'—'}</div><b>Display ID</b><div class="ids">${x.displays.map(id=>`<span>${id}</span>`).join('')||'—'}</div><p>${text('ID grupları kaynakta aynı ada göre eşleştirilmiştir.','IDs are grouped by name in the source.')}</p><a href="https://warcraft.wiki.gg/wiki/Special:Search?search=${encodeURIComponent(x.name)}" target="_blank" rel="noopener">${text('Warcraft Wiki’de isimle ara ↗','Search name on Warcraft Wiki ↗')}</a></div>`}function translate(){document.documentElement.lang=lang;$('lang').textContent=lang==='tr'?'EN':'TR';$('title').textContent=text('NPC Veritabanı','NPC Database');$('intro').textContent=text('Retail NPC adları, NPC ID ve model ID grupları.','Retail NPC names and grouped NPC and display IDs.');$('search').placeholder=text('NPC adı, NPC ID veya model ID ara...','Search NPC name, NPC ID or display ID...');$('note').textContent=text('Kaynak, aynı isim altındaki NPC ID’lerini ve model ID’lerini gruplar; hangi modelin hangi NPC’ye ait olduğunu kesin olarak belirtmez. Görseller ve tüm NPC’lerin eksiksiz olduğu doğrulanmadı.','The source groups NPC and display IDs by name; it does not establish which model belongs to which NPC. Images and complete NPC coverage are not verified.');$('footer').textContent=text('Kaynak:','Source:');$('foot2').textContent=text('Retail kaynağının oyun build numarası doğrulanmadı. Blizzard ile bağlantılı olmayan topluluk projesidir.','The retail source build is unverified. An independent fan project unaffiliated with Blizzard.');if(selected)show(selected);else $('detail').textContent=text('Bir NPC seç.','Select an NPC.');if(items.length)render()}$('lang').onclick=()=>{lang=lang==='tr'?'en':'tr';localStorage.setItem('atlas-lang',lang);translate()};$('search').oninput=filter;$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('rows').onclick=e=>{const b=e.target.closest('[data-i]');if(b){show(found[+b.dataset.i]);if(matchMedia('(max-width:750px)').matches)$('detail').classList.add('mobile-open')}};translate();async function load(){try{const res=await fetch('https://raw.githubusercontent.com/psyny/CreatureDisplayDB/main/CreatureDisplayDB_retail_db_general.lua');if(!res.ok)throw Error('HTTP '+res.status);const raw=await res.text();const re=/t\[\d+\]=\[=\[([^\t\n]+)\t\d+:([\d,]*):([\d,]*)\]=\]/g;for(const m of raw.matchAll(re)){const npcs=m[2].split(',').filter(Boolean),displays=m[3].split(',').filter(Boolean),name=m[1];items.push({name,npcs,displays,index:(name+' '+npcs.join(' ')+' '+displays.join(' ')).toLowerCase()})}if(!items.length)throw Error('Unknown data format');filter()}catch(e){$('status').textContent=text('Veri yüklenemedi: ','Data could not be loaded: ')+e.message}}load();
</script></body></html>
