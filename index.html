let lang=localStorage.getItem('atlas-lang')||'tr';const tr={loading:'yükleniyor...',loaded:'kayıt yüklendi',error:'Veri yüklenemedi. GitHub bağlantısını kontrol edip sürümü yeniden seçin.',records:'sonuç',empty:'Bu filtrelerle eşya bulunamadı.',select:'Ayrıntıları görmek için listeden bir eşya seç.',none:'Belirtilmemiş',missing:'Açıklama bulunamadı.',source:'Kaynak',add:'♡ Favorilere ekle',remove:'♥ Favorilerden çıkar',wowhead:'Warcraft Wiki’de ara ↗',unknown:'Nadirlik belirtilmemiş'},en={loading:'loading...',loaded:'records loaded',error:'Data could not be loaded. Check your connection to GitHub and select the version again.',records:'results',empty:'No items match these filters.',select:'Select an item to inspect its details.',none:'Not specified',missing:'No description available.',source:'Source',add:'♡ Add to favorites',remove:'♥ Remove from favorites',wowhead:'Search Warcraft Wiki ↗',unknown:'Quality unknown'};const t=k=>(lang==='tr'?tr:en)[k];const repo='https://raw.githubusercontent.com/Napalmsteak/WoW-Classic-Item-Caches/main/';const files={'Classic Era':'Classic Era Cache.json','Season of Discovery':'Season of Discovery Cache.json','Forever':'Forever Cache.json','TBC Classic':'TBC Classic Cache.json','Wrath Classic':'Wrath Classic Cache.json','Cata Classic':'Cata Classic Cache.json','MoP Classic':'MoP Classic Cache.json'};const qualities=['Poor','Common','Uncommon','Rare','Epic','Legendary','Artifact','Heirloom'];const colors=['#9d9d9d','#ffffff','#1eff00','#62a8ef','#c18af0','#ff8000','#e6cc80','#00ccff'];const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let items=[],filtered=[],current=null,page=1,onlyFav=false,request=0,cache={};let fav;try{fav=new Set(JSON.parse(localStorage.getItem('wow-atlas-favorites-v2')||'[]'))}catch{fav=new Set()}const key=x=>`${x.itemExpansion||$('expansion').value}:${x.itemId}`;function icon(x){return /^[a-zA-Z0-9_-]+$/.test(x.iconName||'')?repo+'icons/'+x.iconName+'.jpg':''}function quality(x){const m=String(x.tooltipHtml||'').match(/class=["'][^"']*\bq([0-7])\b/i);return m?+m[1]:-1}function cleanTooltip(html){let d=new DOMParser().parseFromString(String(html||''),'text/html');d.querySelectorAll('script,style,iframe,object').forEach(x=>x.remove());d.querySelectorAll('br,tr').forEach(e=>e.append('\n'));return d.body.textContent.replace(/\n[\s\n]+/g,'\n').trim()}const iconCache=new Map();let iconGeneration=0;async function resolveRetailIcons(batch){const generation=++iconGeneration;const targets=batch.filter(x=>!x.iconName&&!iconCache.has(x.itemId));if(!targets.length)return;const titles=[...new Set(targets.map(x=>x.name.replace(/\|/g,'')))].join('|');try{const u='https://warcraft.wiki.gg/api.php?'+new URLSearchParams({action:'query',prop:'revisions',rvprop:'content',rvslots:'main',formatversion:'2',format:'json',origin:'*',titles});const response=await fetch(u);if(!response.ok)throw Error('wiki');const j=await response.json();for(const p of j.query?.pages||[]){const content=p.revisions?.[0]?.slots?.main?.content||'';for(const m of content.matchAll(/\{\{#data:[^\n]*([\s\S]*?)\}\}/g)){const block=m[1],id=block.match(/\|\s*itemid\s*=\s*(\d+)/i),ic=block.match(/\|\s*icon\s*=\s*([\w-]+)/i);if(id&&ic)iconCache.set(Number(id[1]),ic[1].toLowerCase())}}if(generation!==iconGeneration)return;document.querySelectorAll('img[data-item]').forEach(img=>{const slug=iconCache.get(Number(img.dataset.item));if(slug){img.src='https://render.worldofwarcraft.com/us/icons/56/'+encodeURIComponent(slug)+'.jpg';img.style.visibility='visible'}})}catch(e){console.warn('Item icon lookup unavailable',e)}}
function itemKind(x){if(x.category){if(['Weapon','Armor','Quest','Consumable','TradeGoods'].includes(x.category))return x.category;return 'Other'}const txt=cleanTooltip(x.tooltipHtml||'');if(/\bQuest Item\b/i.test(txt))return 'Quest';if(/\b(One-Hand|Two-Hand|Main Hand|Off Hand|Ranged|Sword|Dagger|Axe|Mace|Polearm|Staff|Bow|Crossbow|Wand|Fist Weapon)\b/i.test(txt))return 'Weapon';if(/\b(Head|Shoulder|Chest|Waist|Legs|Feet|Wrist|Hands|Finger|Trinket|Neck|Back|Shield|Held In Off-hand)\b/i.test(txt))return 'Armor';return 'Unknown'}function mapItem(x){return {...x,_kind:itemKind(x),level:x.level||String(x.tooltipHtml||'').replace(/<[^>]*>/g,' ').match(/Item Level\s*(\d+)/i)?.[1]||'',_q:Number.isInteger(x._q)?x._q:quality(x),_search:[x.name,x.itemId,...(x.sourceLabels||[]),...(x.bossNames||[])].join(' ').toLowerCase()}}function setStatus(t,error=false){$('status').textContent=t;$('status').className='status'+(error?' error':'')}
async function load(){const version=$('expansion').value,seq=++request;current=null;page=1;items=[];filtered=[];$('rows').innerHTML='';$('detail').innerHTML='<div class="tooltip muted">'+t('select')+'</div>';setStatus(version+' '+t('loading'));try{if(!cache[version]){const retail=/^Retail (\d+)$/.exec(version);const res=await fetch(retail?'data/retail-'+retail[1]+'.json':repo+encodeURIComponent(files[version]));if(!res.ok)throw Error('HTTP '+res.status);const json=await res.json();if(!Array.isArray(json))throw Error('Beklenmeyen veri biçimi');cache[version]=json.map(mapItem)}if(seq!==request)return;items=cache[version];const slotNames={INVTYPE_2HWEAPON:'İki elli / Two-hand',INVTYPE_WEAPON:'Tek elli / One-hand',INVTYPE_WEAPONMAINHAND:'Ana el / Main hand',INVTYPE_HEAD:'Baş / Head',INVTYPE_CHEST:'Göğüs / Chest',INVTYPE_SHOULDER:'Omuz / Shoulder',INVTYPE_LEGS:'Bacak / Legs',INVTYPE_FEET:'Ayak / Feet',INVTYPE_HAND:'Eller / Hands',INVTYPE_WRIST:'Bilek / Wrist',INVTYPE_WAIST:'Bel / Waist',INVTYPE_FINGER:'Yüzük / Ring',INVTYPE_TRINKET:'Aksesuar / Trinket',INVTYPE_NECK:'Boyun / Neck',INVTYPE_CLOAK:'Pelerin / Cloak',INVTYPE_SHIELD:'Kalkan / Shield',INVTYPE_ROBE:'Cübbe / Robe',INVTYPE_NON_EQUIP_IGNORE:'Kuşanılamaz / Non-equippable',INVTYPE_HOLDABLE:'İkincil el / Off-hand',INVTYPE_RANGED:'Menzilli / Ranged',INVTYPE_RANGEDRIGHT:'Menzilli / Ranged',INVTYPE_PROFESSION_TOOL:'Meslek aleti / Profession tool',INVTYPE_PROFESSION_GEAR:'Meslek giysisi / Profession gear',INVTYPE_BAG:'Çanta / Bag',INVTYPE_BODY:'Gömlek / Shirt',INVTYPE_TABARD:'Tabard'};const vals=[...new Set(items.map(x=>x.slot).filter(Boolean))].sort();$('sourceType').innerHTML='<option value="">'+(lang==='en'?'All slots':'Tüm yuvalar')+'</option>'+vals.map(x=>`<option value="${esc(x)}">${esc(slotNames[x]||x)}</option>`).join('');setStatus(`${version} · ${items.length.toLocaleString(lang==='tr'?'tr-TR':'en-US')} ${t('loaded')}`);apply()}catch(e){if(seq!==request)return;setStatus(t('error')+' ('+e.message+')',true);$('rows').innerHTML='<div class="empty">Katalog şu anda kullanılamıyor. <button class="btn" onclick="load()">Tekrar dene</button></div>';$('count').textContent='0 kayıt'}}function apply(){const q=$('search').value.trim().toLowerCase(),qual=$('quality').value,type=$('sourceType').value,kind=$('itemKind').value;filtered=items.filter(x=>(!q||x._search.includes(q))&&(qual===''||x._q===Number(qual))&&(!type||x.slot===type)&&(!kind||x._kind===kind)&&(!$('minLevel').value||Number(x.level)>=Number($('minLevel').value))&&(!$('maxLevel').value||Number(x.level)<=Number($('maxLevel').value))&&(!onlyFav||fav.has(key(x))));const sort=$('sort').value;filtered.sort((a,b)=>sort==='levelDesc'?Number(b.level||0)-Number(a.level||0):sort==='levelAsc'?Number(a.level||0)-Number(b.level||0):sort==='quality'?b._q-a._q:sort==='id'?a.itemId-b.itemId:a.name.localeCompare(b.name));page=1;render()}function render(){const pages=Math.max(1,Math.ceil(filtered.length/30));page=Math.max(1,Math.min(page,pages));$('count').textContent=filtered.length.toLocaleString('tr-TR')+' '+t('records');$('page').textContent=page+' / '+pages;$('prev').disabled=page===1;$('next').disabled=page===pages;$('rows').innerHTML=filtered.slice((page-1)*30,page*30).map((x,i)=>`<button class="row ${current===x?'selected':''}" data-i="${(page-1)*30+i}"><span class="item"><img class="icon" loading="lazy" data-item="${esc(x.itemId)}" src="${esc(icon(x)||(iconCache.has(x.itemId)?'https://render.worldofwarcraft.com/us/icons/56/'+encodeURIComponent(iconCache.get(x.itemId))+'.jpg':'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2242%22 height=%2242%22%3E%3Crect width=%2242%22 height=%2242%22 fill=%22%23272018%22/%3E%3C/svg%3E'))}" alt="" onerror="this.style.visibility='hidden'"><span class="item-name" style="color:${colors[x._q]||'#d6c7ab'}">${esc(x.name)}<small style="display:block;color:#a99b82;font-size:11px;margin-top:4px">#${esc(x.itemId)} · ${esc(x._kind)}${x.level?' · iLvl '+esc(x.level):''}</small></span></span><span class="row-meta">${esc(x._kind||x.category||'—')}</span><span class="row-meta">#${esc(x.itemId)}</span></button>`).join('')||'<div class="empty">'+t('empty')+'</div>';resolveRetailIcons(filtered.slice((page-1)*30,page*30))}function show(x){current=x;const q=x._q,lines=cleanTooltip(x.tooltipHtml);$('detail').innerHTML=`<div class="tooltip"><div class="tooltip-header"><img data-item="${esc(x.itemId)}" src="${esc(icon(x)||(iconCache.has(x.itemId)?'https://render.worldofwarcraft.com/us/icons/56/'+encodeURIComponent(iconCache.get(x.itemId))+'.jpg':'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2256%22 height=%2256%22%3E%3Crect width=%2256%22 height=%2256%22 fill=%22%23272018%22/%3E%3C/svg%3E'))}" alt="" onerror="this.style.visibility='hidden'"><div><div class="name" style="color:${colors[q]||'#fff'}">${esc(x.name)}</div><div class="muted">${esc(qualities[q]||t('unknown'))} · #${esc(x.itemId)}</div></div></div><div class="detail-text">${esc(lines||(x.category?`${x.category}\nItem Level: ${x.level||'—'}\n${x.slot||''}\n${(x.stats||'').split(',').join('\n')}`:t('missing')))}</div></div><div class="detail-source" ${!(x.sourceLabels||[]).length?'hidden':''}><b>${lang==='en'?'Loot location':'Ganimet yeri'}</b><br>${esc((x.sourceLabels||[]).join(', ')||t('none'))}<br>${(x.bossNames||[]).length?'<b>Boss:</b> '+esc(x.bossNames.join(', ')):''}</div><button class="btn" id="toggleFav">${fav.has(key(x))?t('remove'):t('add')}</button><button class="btn" id="copyId">${lang==='en'?'Copy ID':'ID kopyala'}</button><button class="btn" id="shareItem">${lang==='en'?'Copy item link':'Eşya bağlantısını kopyala'}</button>`;$('copyId').onclick=()=>copyText(String(x.itemId));$('shareItem').onclick=()=>{const u=new URL(location.href);u.search='';u.searchParams.set('version',$('expansion').value);u.searchParams.set('item',x.itemId);copyText(u.href)};$('toggleFav').onclick=()=>{let k=key(x);fav.has(k)?fav.delete(k):fav.add(k);try{localStorage.setItem('wow-atlas-fa
